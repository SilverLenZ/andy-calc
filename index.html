<style>
  :root {
    --panel: #11161f;
    --panel2: #181f2b;
    --panel3: #1e2735;
    --border: #273143;
    --accent: #e94560;
    --accent2: #ff6b6b;
    --teal: #4ecdc4;
    --yellow: #ffe66d;
    --blue: #2962ff;
    --green: #2ecc71;
    --red: #e94560;
    --muted: #7a8498;
    --text: #e4e8f0;
    --display: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Arial Narrow', Impact, sans-serif;
    --mono: 'SF Mono', ui-monospace, 'Cascadia Mono', 'JetBrains Mono', Consolas, monospace;
    --body: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --sidebar-w: 150px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 100%; height: 100%;
    background: #0a0e14;
    color: var(--text);
    font-family: var(--body);
    font-size: 16px;
    overflow: hidden;
  }

  /* ════════════════════════════════════════════
     WORKSPACE — everything left of the calculator
     ════════════════════════════════════════════ */
  .workspace {
    position: fixed;
    top: 0; left: 0; bottom: 0;
    right: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    z-index: 1;
  }

  /* ── chart row: 5m | vsplit | 1m ───────────── */
  .charts {
    display: flex;
    flex-direction: row;
    height: 62%;            /* JS-controlled via hsplit */
    min-height: 110px;
    flex-shrink: 0;
  }

  .chart-pane {
    position: relative;
    display: flex;
    flex-direction: column;
    min-width: 180px;
    background: #131722;    /* TV native dark — no resize flash */
  }
  #pane5m { flex: 0 0 50%; }  /* JS-controlled via vsplit */
  #pane1m { flex: 1 1 auto; }

  .pane-head {
    height: 24px;
    flex-shrink: 0;
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 0 10px;
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border-bottom: 1px solid var(--border);
    user-select: none;
  }
  .pane-head .dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  #pane5m .pane-head .dot { background: var(--yellow); box-shadow: 0 0 6px rgba(255,230,109,.6); }
  #pane1m .pane-head .dot { background: var(--teal);   box-shadow: 0 0 6px rgba(78,205,196,.6); }
  .pane-head .sym {
    font-family: var(--display);
    font-size: 11px; font-weight: 800;
    letter-spacing: 2px;
    color: var(--text);
  }
  .pane-head .tf {
    font-family: var(--mono);
    font-size: 10px; font-weight: 800;
    color: var(--muted);
    letter-spacing: 1px;
  }
  .pane-head .role {
    margin-left: auto;
    font-family: var(--display);
    font-size: 8px; font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--muted);
  }

  .chart-frame { position: relative; flex: 1; min-height: 0; }
  .chart-frame iframe {
    position: absolute;
    inset: 0;
    width: 100%; height: 100%;
    border: 0;
  }

  /* ── splitters ─────────────────────────────── */
  .vsplit {
    width: 6px;
    flex-shrink: 0;
    cursor: col-resize;
    background: var(--border);
    position: relative;
    transition: background .15s, box-shadow .15s;
    z-index: 5;
  }
  .vsplit::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 2px; height: 34px;
    border-radius: 2px;
    background: var(--muted);
    transition: background .15s, height .15s;
  }
  .vsplit:hover, .vsplit.active {
    background: var(--blue);
    box-shadow: 0 0 12px rgba(41,98,255,.55);
  }
  .vsplit:hover::after, .vsplit.active::after {
    background: #fff; height: 52px;
  }

  .hsplit {
    height: 6px;
    flex-shrink: 0;
    cursor: row-resize;
    background: var(--border);
    position: relative;
    transition: background .15s, box-shadow .15s;
    z-index: 5;
  }
  .hsplit::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    height: 2px; width: 34px;
    border-radius: 2px;
    background: var(--muted);
    transition: background .15s, width .15s;
  }
  .hsplit:hover, .hsplit.active {
    background: var(--blue);
    box-shadow: 0 0 12px rgba(41,98,255,.55);
  }
  .hsplit:hover::after, .hsplit.active::after {
    background: #fff; width: 52px;
  }

  /* ── dock — ToS Desktop window sits on top of this ── */
  .dock {
    flex: 1;
    min-height: 64px;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(ellipse 55% 70% at 50% 100%, rgba(41,98,255,.05) 0%, transparent 70%),
      repeating-linear-gradient(0deg, transparent 0 39px, rgba(39,49,67,.22) 39px 40px),
      repeating-linear-gradient(90deg, transparent 0 39px, rgba(39,49,67,.22) 39px 40px),
      #0a0e14;
    user-select: none;
    overflow: hidden;
  }
  .dock-label {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 6px;
    opacity: .5;
    transition: opacity .3s;
    pointer-events: none;
  }
  .dock:hover .dock-label { opacity: .85; }
  .dock-label .big {
    font-family: var(--display);
    font-size: 15px; font-weight: 800;
    letter-spacing: 5px;
    color: var(--muted);
  }
  .dock-label .small {
    font-family: var(--display);
    font-size: 9px; font-weight: 800;
    letter-spacing: 2px;
    color: var(--muted);
  }
  .dock-corner {
    position: absolute;
    width: 14px; height: 14px;
    border-color: var(--border);
    border-style: solid;
    border-width: 0;
  }
  .dock-corner.tl { top: 10px; left: 10px;  border-top-width: 2px; border-left-width: 2px; }
  .dock-corner.tr { top: 10px; right: 10px; border-top-width: 2px; border-right-width: 2px; }
  .dock-corner.bl { bottom: 10px; left: 10px;  border-bottom-width: 2px; border-left-width: 2px; }
  .dock-corner.br { bottom: 10px; right: 10px; border-bottom-width: 2px; border-right-width: 2px; }

  /* drag veil — keeps iframes from swallowing mouse events mid-drag */
  .drag-veil {
    position: fixed; inset: 0;
    z-index: 900;
    display: none;
    background: transparent;
  }
  body.dragging .drag-veil { display: block; }
  body.dragging-col  .drag-veil { cursor: col-resize; }
  body.dragging-row  .drag-veil { cursor: row-resize; }
  body.dragging iframe { pointer-events: none; }

  /* ════════════════════════════════════════════
     CALCULATOR SIDEBAR — docked right
     ════════════════════════════════════════════ */
  .sidebar {
    position: fixed;
    top: 0; right: 0; bottom: 0;
    width: var(--sidebar-w);
    display: flex;
    flex-direction: column;
    background: linear-gradient(180deg, var(--panel2) 0%, var(--panel) 100%);
    border-left: 2px solid var(--border);
    box-shadow: -10px 0 32px rgba(0,0,0,.45);
    z-index: 10;
    padding: 12px 9px 10px;
    gap: 9px;
    overflow-y: auto;
  }

  .masthead {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    padding-bottom: 9px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .masthead .title {
    font-family: var(--display);
    font-size: 17px; font-weight: 800;
    letter-spacing: 3px;
    color: var(--accent2);
  }
  .masthead .sub {
    font-family: var(--display);
    font-size: 8px; font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--muted);
  }

  .field { display: flex; flex-direction: column; gap: 3px; flex-shrink: 0; }
  .field label {
    font-family: var(--display);
    font-size: 9px; font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--muted);
    user-select: none;
    text-align: center;
  }
  .field input {
    width: 100%;
    background: var(--panel3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--yellow);
    font-family: var(--mono);
    font-size: 19px; font-weight: 800;
    padding: 7px 4px;
    outline: none;
    text-align: center;
    transition: border-color .15s, box-shadow .15s;
  }
  .field input:focus {
    border-color: var(--blue);
    box-shadow: 0 0 0 2px rgba(41,98,255,.22);
  }
  .field input::placeholder { color: var(--muted); }
  .field input::-webkit-outer-spin-button,
  .field input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
  .field input[type=number] { -moz-appearance: textfield; appearance: textfield; }
  .field.readonly input { color: var(--text); font-size: 14px; padding: 5px 4px; cursor: default; }

  .divider { display: flex; align-items: center; gap: 7px; flex-shrink: 0; user-select: none; }
  .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .divider span {
    font-family: var(--display);
    font-size: 9px; font-weight: 800;
    letter-spacing: 2px; color: var(--muted);
  }

  .ladder { display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; }

  .rung {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    background: var(--panel2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--border);
    border-radius: 5px;
    padding: 7px 6px 8px;
    cursor: pointer;
    user-select: none;
    transition: background .12s, border-color .12s, transform .12s;
    position: relative;
    overflow: hidden;
  }
  .rung:hover { background: var(--panel3); transform: translateX(-2px); }
  .rung:hover .hint { opacity: 1; }
  .rung:active { transform: translateX(-2px) scale(.98); }

  .rung .lbl {
    font-family: var(--display);
    font-size: 9px; font-weight: 800;
    letter-spacing: 1.5px;
    color: var(--muted);
  }
  .rung .val {
    font-family: var(--mono);
    font-size: 18px; font-weight: 800;
    color: var(--text);
    line-height: 1.1;
  }
  .rung .hint {
    position: absolute;
    right: 5px; top: 3px;
    font-family: var(--display);
    font-size: 7px; font-weight: 800;
    letter-spacing: 1px;
    color: var(--blue);
    opacity: 0;
    transition: opacity .15s;
  }

  .rung.entry { border-left-color: var(--yellow); }
  .rung.entry .val { color: var(--yellow); }
  .rung.stop  { border-left-color: var(--red); }
  .rung.stop .val { color: var(--accent2); }
  .rung.tp1   { border-left-color: var(--teal); }
  .rung.tp2   { border-left-color: var(--green); }
  .rung.tp3   { border-left-color: var(--blue); }

  .rung .val.bump { animation: bump .35s ease; }
  @keyframes bump {
    0%   { transform: translateY(5px); opacity: .2; }
    100% { transform: translateY(0);   opacity: 1; }
  }
  .rung.copied { background: rgba(46,204,113,.16); border-color: var(--green); }
  .rung.copied .val { color: var(--green); }

  .risk {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1px;
    background: rgba(233,69,96,.07);
    border: 1px dashed rgba(233,69,96,.35);
    border-radius: 5px;
    padding: 6px 6px 7px;
    flex-shrink: 0;
    user-select: none;
  }
  .risk .lbl {
    font-family: var(--display);
    font-size: 9px; font-weight: 800;
    letter-spacing: 2px; color: var(--muted);
  }
  .risk .val {
    font-family: var(--mono);
    font-size: 14px; font-weight: 800;
    color: var(--accent2);
  }

  .copy-all {
    margin-top: auto;
    flex-shrink: 0;
    padding: 10px 4px;
    background: var(--panel3);
    border: 1px solid var(--blue);
    border-radius: 5px;
    color: var(--text);
    font-family: var(--display);
    font-size: 11px; font-weight: 800;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .copy-all:hover { background: var(--blue); color: #fff; box-shadow: 0 0 14px rgba(41,98,255,.35); }
  .copy-all:active { transform: scale(.97); }
  .copy-all.copied { background: var(--teal); border-color: var(--teal); color: #0a0e14; }

  /* ── TOS order generator ─────────────────── */
  .cp-toggle {
    display: flex; gap: 4px; flex-shrink: 0;
  }
  .cp-toggle button {
    flex: 1;
    padding: 6px 0;
    background: var(--panel3);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--muted);
    font-family: var(--display);
    font-size: 10px; font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all .12s;
    user-select: none;
  }
  .cp-toggle button:hover { border-color: var(--muted); color: var(--text); }
  .cp-toggle button.active-call {
    background: rgba(46,204,113,.15); border-color: var(--green); color: var(--green);
  }
  .cp-toggle button.active-put {
    background: rgba(233,69,96,.15); border-color: var(--red); color: var(--accent2);
  }

  .copy-tos {
    flex-shrink: 0;
    padding: 10px 4px;
    background: rgba(233,69,96,.12);
    border: 1px solid var(--accent);
    border-radius: 5px;
    color: var(--accent2);
    font-family: var(--display);
    font-size: 10px; font-weight: 800;
    letter-spacing: 1.5px;
    cursor: pointer;
    transition: all .15s;
    user-select: none;
  }
  .copy-tos:hover { background: var(--accent); color: #fff; box-shadow: 0 0 14px rgba(233,69,96,.4); }
  .copy-tos:active { transform: scale(.97); }
  .copy-tos.copied { background: var(--green); border-color: var(--green); color: #0a0e14; }
  .copy-targets { background: rgba(255,152,0,.12); border-color: #ff9800; color: #ffb74d; }
  .copy-targets:hover { background: #ff9800; color: #0a0e14; box-shadow: 0 0 14px rgba(255,152,0,.4); }
  .copy-targets.copied { background: var(--green); border-color: var(--green); color: #0a0e14; }
  .copy-runner { background: rgba(156,39,176,.12); border-color: #9c27b0; color: #ce93d8; }
  .copy-runner:hover { background: #9c27b0; color: #fff; box-shadow: 0 0 14px rgba(156,39,176,.4); }
  .copy-runner.copied { background: var(--green); border-color: var(--green); color: #0a0e14; }

  .order-hint {
    flex-shrink: 0; text-align: center; font-size: 10px; letter-spacing: .08em;
    color: var(--muted); padding: 2px 0 4px; user-select: none; opacity: .85;
  }

  /* order preview — visible box, works everywhere */
  .order-box {
    flex-shrink: 0;
    width: 100%;
    height: 96px;
    background: #0a0e14;
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--teal);
    font-family: var(--mono);
    font-size: 8px;
    line-height: 1.5;
    padding: 5px;
    resize: none;
    outline: none;
    white-space: pre;
    overflow: auto;
  }
  .order-box:focus { border-color: var(--blue); }

  .footnote {
    text-align: center;
    font-family: var(--display);
    font-size: 7px; font-weight: 800;
    letter-spacing: 1px;
    color: var(--muted);
    flex-shrink: 0;
    user-select: none;
    line-height: 1.5;
  }
</style>
</head>
<body>

  <!-- ═══ WORKSPACE: charts + dock ═══ -->
  <main class="workspace" id="workspace">

    <section class="charts" id="charts">

      <div class="chart-pane" id="pane5m">
        <div class="pane-head">
          <span class="dot"></span>
          <span class="sym">SPY</span>
          <span class="tf">5M</span>
          <span class="role">STRUCTURE &amp; LEVELS</span>
        </div>
        <div class="chart-frame">
          <!-- SPX -->
        <div class="chart-panel">
            <div class="tv-wrap">
                <div class="tradingview-widget-container">
                    <div class="tradingview-widget-container__widget"></div>

                    <script src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js" async>
                    {
                      "autosize": true,
                      "symbol": "FOREXCOM:SPXUSD",
                      "interval": "240",
                      "theme": "dark",
                      "style": "1",
                      "locale": "en",

                      "hide_top_toolbar": false,
                      "hide_side_toolbar": false,
                      "hide_volume": false,

                      "allow_symbol_change": true,

                      "studies": [
                        "STD;Bollinger_Bands",
                        "STD;Stochastic_RSI"
                      ]
                    }
                    </script>
                </div>
            </div>
        </div>

        </div>
      </div>

      <div class="vsplit" id="vsplit" title="Drag to resize · double-click to reset"></div>

      <div class="chart-pane" id="pane1m">
        <div class="pane-head">
          <span class="dot"></span>
          <span class="sym">SPY</span>
          <span class="tf">1M</span>
          <span class="role">EXECUTION</span>
        </div>
        <div class="chart-frame">
          <iframe
            src="https://s.tradingview.com/widgetembed/?frameElementId=tv1m&amp;symbol=AMEX%3ASPY&amp;interval=1&amp;hidesidetoolbar=0&amp;symboledit=1&amp;saveimage=0&amp;studies=%5B%5D&amp;theme=dark&amp;style=1&amp;timezone=America%2FDenver&amp;withdateranges=1&amp;showpopupbutton=0"
            allowfullscreen allow="fullscreen">
          </iframe>
        </div>
      </div>

    </section>

    <div class="hsplit" id="hsplit" title="Drag to resize charts · double-click to reset"></div>

    <section class="dock" id="dock">
      <span class="dock-corner tl"></span>
      <span class="dock-corner tr"></span>
      <span class="dock-corner bl"></span>
      <span class="dock-corner br"></span>
      <div class="dock-label">
        <span class="big">TOS DESKTOP DOCK</span>
        <span class="small">PLACE THE THINKORSWIM WINDOW OVER THIS AREA &middot; DRAG THE BAR ABOVE TO GROW THE CHARTS</span>
      </div>
    </section>

  </main>

  <!-- ═══ CALCULATOR SIDEBAR ═══ -->
  <aside class="sidebar" aria-label="Andy calculator">

    <div class="masthead">
      <span class="title">ANDY</span>
      <span class="sub">0DTE LADDER</span>
    </div>

    <div class="field">
      <label for="fill">FILL PRICE</label>
      <input type="number" id="fill" step="0.01" min="0" placeholder="0.00" inputmode="decimal" autofocus>
    </div>

    <div class="field">
      <label for="contracts">CONTRACTS</label>
      <input type="number" id="contracts" step="1" min="1" value="4" inputmode="numeric">
    </div>

    <div class="field">
      <label for="strike">STRIKE</label>
      <input type="number" id="strike" step="1" min="0" placeholder="742" inputmode="decimal">
    </div>

    <div class="field">
      <label>TYPE</label>
      <div class="cp-toggle" id="cp-toggle">
        <button type="button" data-cp="CALL" class="active-call">CALL</button>
        <button type="button" data-cp="PUT">PUT</button>
      </div>
    </div>

    <button class="copy-tos" id="copy-bracket">COPY BRACKET</button>

    <div class="field readonly">
      <label>ENTRY $</label>
      <input type="text" id="entry-total" readonly tabindex="-1" value="--">
    </div>

    <div class="divider"><span>LADDER</span></div>

    <div class="ladder" aria-live="polite">
      <div class="rung entry" data-key="entry" title="Click to copy">
        <span class="lbl">ENTRY</span><span class="val" id="v-entry">--</span><span class="hint">COPY</span>
      </div>
      <div class="rung stop" data-key="stop" title="Click to copy">
        <span class="lbl">STOP −10% ×2</span><span class="val" id="v-stop">--</span><span class="hint">COPY</span>
      </div>
      <div class="rung tp1" data-key="tp1" title="Click to copy">
        <span class="lbl">TP1 +10% ×2</span><span class="val" id="v-tp1">--</span><span class="hint">COPY</span>
      </div>
      <div class="rung tp2" data-key="tp2" title="Click to copy">
        <span class="lbl">TP2 +12% ×1</span><span class="val" id="v-tp2">--</span><span class="hint">COPY</span>
      </div>
      <div class="rung tp3" data-key="tp3" title="Click to copy">
        <span class="lbl">RUNNER ×1</span><span class="val" id="v-tp3">--</span><span class="hint">TRAIL</span>
      </div>
    </div>

    <div class="risk">
      <span class="lbl">RISK</span>
      <span class="val" id="v-risk">--</span>
    </div>

    <div class="divider"><span>TOS ORDER</span></div>

    <textarea class="order-box" id="order-box" readonly spellcheck="false" placeholder="order text appears here"></textarea>

    <div class="footnote">CLICK RUNG<br>TO COPY</div>

  </aside>

  <div class="drag-veil" id="veil"></div>

<script>
(function () {
  'use strict';

  /* ════════════════════════════════════════════
     SPLITTERS — sizes persist across reloads
     ════════════════════════════════════════════ */
  var workspace = document.getElementById('workspace');
  var charts    = document.getElementById('charts');
  var pane5m    = document.getElementById('pane5m');
  var vsplit    = document.getElementById('vsplit');
  var hsplit    = document.getElementById('hsplit');
  var body      = document.body;

  var LS_V = 'andy-station-vsplit';   // % width of 5m pane
  var LS_H = 'andy-station-hsplit';   // % height of chart row

  var V_DEFAULT = 50, H_DEFAULT = 62;
  var V_MIN = 22, V_MAX = 78;
  var H_MIN = 24, H_MAX = 92;

  function clamp(n, lo, hi) { return Math.min(hi, Math.max(lo, n)); }

  function loadPct(key, def) {
    try {
      var v = parseFloat(localStorage.getItem(key));
      return isFinite(v) ? v : def;
    } catch (e) { return def; }
  }
  function savePct(key, v) {
    try { localStorage.setItem(key, String(v)); } catch (e) {}
  }

  function applyV(pct) {
    pane5m.style.flex = '0 0 ' + pct + '%';
  }
  function applyH(pct) {
    charts.style.height = pct + '%';
  }

  var vPct = clamp(loadPct(LS_V, V_DEFAULT), V_MIN, V_MAX);
  var hPct = clamp(loadPct(LS_H, H_DEFAULT), H_MIN, H_MAX);
  applyV(vPct);
  applyH(hPct);

  function startDrag(kind) {
    body.classList.add('dragging', kind === 'v' ? 'dragging-col' : 'dragging-row');
    (kind === 'v' ? vsplit : hsplit).classList.add('active');

    function onMove(e) {
      if (kind === 'v') {
        var r = workspace.getBoundingClientRect();
        vPct = clamp(((e.clientX - r.left) / r.width) * 100, V_MIN, V_MAX);
        applyV(vPct);
      } else {
        var r2 = workspace.getBoundingClientRect();
        hPct = clamp(((e.clientY - r2.top) / r2.height) * 100, H_MIN, H_MAX);
        applyH(hPct);
      }
    }
    function onUp() {
      body.classList.remove('dragging', 'dragging-col', 'dragging-row');
      vsplit.classList.remove('active');
      hsplit.classList.remove('active');
      savePct(LS_V, vPct);
      savePct(LS_H, hPct);
      window.removeEventListener('mousemove', onMove);
      window.removeEventListener('mouseup', onUp);
    }
    window.addEventListener('mousemove', onMove);
    window.addEventListener('mouseup', onUp);
  }

  vsplit.addEventListener('mousedown', function (e) { e.preventDefault(); startDrag('v'); });
  hsplit.addEventListener('mousedown', function (e) { e.preventDefault(); startDrag('h'); });

  // double-click resets
  vsplit.addEventListener('dblclick', function () { vPct = V_DEFAULT; applyV(vPct); savePct(LS_V, vPct); });
  hsplit.addEventListener('dblclick', function () { hPct = H_DEFAULT; applyH(hPct); savePct(LS_H, hPct); });

  /* ════════════════════════════════════════════
     CALCULATOR — same math as Andy Desk TradeModel
     ════════════════════════════════════════════ */
  var CFG = { stopPct: -0.10, tp1Pct: 0.10, tp2Pct: 0.12, tp3Pct: 0.15, mult: 100 };

  var fillEl = document.getElementById('fill');
  var contractsEl = document.getElementById('contracts');
  var entryTotalEl = document.getElementById('entry-total');
  var rungs = document.querySelectorAll('.rung');

  var last = {};

  function round2(n) { return Math.round(n * 100) / 100; }

  function calc() {
    var price = parseFloat(fillEl.value);
    var c = parseInt(contractsEl.value, 10);
    if (!isFinite(price) || price <= 0 || !isFinite(c) || c <= 0) return null;
    var stop = round2(price * (1 + CFG.stopPct));
    return {
      price: price, contracts: c,
      entry: round2(price), stop: stop,
      tp1: round2(price * (1 + CFG.tp1Pct)),
      tp2: round2(price * (1 + CFG.tp2Pct)),
      tp3: round2(price * (1 + CFG.tp3Pct)),
      entryTotal: round2(price * c * CFG.mult),
      risk: round2((price - stop) * c * CFG.mult)
    };
  }

  function setVal(id, text, raw) {
    var el = document.getElementById(id);
    if (last[id] === text) return;
    el.textContent = text;
    last[id] = text;
    if (raw != null) {
      el.classList.remove('bump');
      void el.offsetWidth;
      el.classList.add('bump');
    }
  }

  function render() {
    var r = calc();
    if (!r) {
      ['entry','stop','tp1','tp2','tp3'].forEach(function (k) { setVal('v-' + k, '--', null); });
      setVal('v-risk', '--', null);
      entryTotalEl.value = '--';
      return;
    }
    setVal('v-entry', '$' + r.entry.toFixed(2), r.entry);
    setVal('v-stop',  '$' + r.stop.toFixed(2),  r.stop);
    setVal('v-tp1',   '$' + r.tp1.toFixed(2),   r.tp1);
    setVal('v-tp2',   '$' + r.tp2.toFixed(2),   r.tp2);
    setVal('v-tp3',   '$' + r.tp3.toFixed(2),   r.tp3);
    setVal('v-risk',  '$' + r.risk.toFixed(2),  r.risk);
    entryTotalEl.value = '$' + r.entryTotal.toFixed(2);
  }

  /* Clipboard helper.
     On HTTPS (GitHub Pages) navigator.clipboard.writeText is available and
     writes pure text/plain — ideal for ToS paste. On plain HTTP it's blocked,
     so we fall back to selecting the visible order box + execCommand. */
  function copyText(text, onDone) {
    function fallback() {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
      onDone();
    }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(onDone, fallback);
    } else {
      fallback();
    }
  }

  function flashRung(rung) {
    rung.classList.add('copied');
    setTimeout(function () { rung.classList.remove('copied'); }, 600);
  }

  rungs.forEach(function (rung) {
    rung.addEventListener('click', function () {
      var r = calc();
      if (!r) return;
      var raw = r[rung.getAttribute('data-key')];
      if (raw == null) return;
      copyText(raw.toFixed(2), function () { flashRung(rung); });
    });
  });

  fillEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') { contractsEl.focus(); contractsEl.select(); }
  });
  contractsEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      var r = calc();
      if (!r) return;
      var tp1Rung = document.querySelector('.rung.tp1');
      copyText(r.tp1.toFixed(2), function () { flashRung(tp1Rung); });
    }
  });

  fillEl.addEventListener('input', render);
  contractsEl.addEventListener('input', render);

  render();

  /* ════════════════════════════════════════════
     TOS ORDER GENERATOR — v2 7-line 1st Triggers 3 OCO
     Expiry is always TODAY (0DTE). On HTTPS the
     clean clipboard API writes pure text/plain;
     on plain HTTP we fall back to selecting the
     visible order box + execCommand.
     ════════════════════════════════════════════ */
  var strikeEl   = document.getElementById('strike');
  var cpToggle   = document.getElementById('cp-toggle');
  var copyBracketBtn = document.getElementById('copy-bracket');
  var orderBox   = document.getElementById('order-box');
  var currentCP  = 'CALL';
  var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

  // CALL / PUT toggle
  cpToggle.addEventListener('click', function (e) {
    var btn = e.target.closest('button');
    if (!btn) return;
    currentCP = btn.getAttribute('data-cp');
    cpToggle.querySelectorAll('button').forEach(function (b) { b.className = ''; });
    btn.className = currentCP === 'CALL' ? 'active-call' : 'active-put';
    updateOrderBox();
  });

  function todayStr() {
    var now = new Date();
    return now.getDate() + ' ' + MONTHS[now.getMonth()] + ' ' + String(now.getFullYear()).slice(2);
  }

  function fmtStrike(n) {
    return n % 1 === 0 ? String(n) : String(n);
  }

  // v2 Broker Adapter — 7-line 1st Triggers 3 OCO payload
  function buildBracketOrder(r) {
    var strike = parseFloat(strikeEl.value);
    if (!isFinite(strike) || strike <= 0) return null;
    if (!r) return null;

    var sym = 'SPY 100 ' + todayStr() + ' ' + fmtStrike(strike) + ' ' + currentCP;
    var price = round2(r.price);
    var stop = round2(price * 0.90);
    var tp1 = round2(price * 1.10);
    var tp2 = round2(price * 1.12);

    var tp1Qty = Math.floor(r.contracts / 2);
    var tp2Qty = r.contracts >= 3 ? 1 : 0;
    var runnerQty = r.contracts - tp1Qty - tp2Qty;

    return [
      'BUY +' + r.contracts + ' ' + sym + ' @' + price.toFixed(2) + ' LMT',
      '',
      'SELL -' + tp1Qty + ' ' + sym + ' @' + tp1.toFixed(2) + ' LMT',
      'SELL -' + tp1Qty + ' ' + sym + ' STP ' + stop.toFixed(2),
      '',
      'SELL -' + tp2Qty + ' ' + sym + ' @' + tp2.toFixed(2) + ' LMT',
      'SELL -' + tp2Qty + ' ' + sym + ' STP ' + stop.toFixed(2),
      '',
      'SELL -' + runnerQty + ' ' + sym + ' @9.99 TRSTP MARK-0.25',
      'SELL -' + runnerQty + ' ' + sym + ' STP ' + stop.toFixed(2)
    ].join('\n');
  }

  function updateOrderBox() {
    var r = calc();
    if (!r) { orderBox.value = ''; return; }
    var text = buildBracketOrder(r);
    orderBox.value = text || '';
  }

  // keep the box live as inputs change
  fillEl.addEventListener('input', updateOrderBox);
  contractsEl.addEventListener('input', updateOrderBox);
  strikeEl.addEventListener('input', updateOrderBox);

  // clicking the box selects everything (manual copy fallback)
  orderBox.addEventListener('focus', function () { orderBox.select(); });

  // COPY BRACKET — single 7-line 1st Triggers 3 OCO payload
  copyBracketBtn.addEventListener('click', function () {
    var r = calc();
    if (!r) return;
    var text = buildBracketOrder(r);
    if (!text) {
      copyBracketBtn.textContent = 'NEED STRIKE';
      setTimeout(function () { copyBracketBtn.textContent = 'COPY BRACKET'; }, 1200);
      return;
    }
    orderBox.value = text;

    function flashCopied() {
      copyBracketBtn.textContent = 'COPIED ✓';
      copyBracketBtn.classList.add('copied');
      setTimeout(function () {
        copyBracketBtn.textContent = 'COPY BRACKET';
        copyBracketBtn.classList.remove('copied');
      }, 1500);
    }

    function selectBoxFallback() {
      orderBox.focus();
      orderBox.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      if (ok) {
        flashCopied();
      } else {
        copyBracketBtn.textContent = 'CTRL+C';
        setTimeout(function () { copyBracketBtn.textContent = 'COPY BRACKET'; }, 2000);
      }
    }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(flashCopied, selectBoxFallback);
    } else {
      selectBoxFallback();
    }
  });

  updateOrderBox();
})();
</script>
</body>
